# Unified pipeline — ingestion + query stages (seeded to shared DB)
pipeline:
  id: default_rag
  name: Default RAG
  description: Vector retrieval with HyDE, reranking, and contextual response
  embedding_model: nvidia-embed
  chat_model: llama-3.3-70b-versatile
  reranker_model: rerank-english-v3.0
  llm_params:
    temperature: 0.3
    max_tokens: 2048
  status: active

  stages:
    ingestion:
      strategy: text_ingestion
      config:
        encoding: utf-8

    chunking:
      strategy: recursive_chunking
      config:
        chunk_size: 1000
        chunk_overlap: 200
        separators: ["\n\n", "\n", ". ", " ", ""]

    embedding:
      strategy: litellm_embedding
      config:
        model: nvidia-embed
        dimensions: 2048

    indexing:
      strategy: qdrant_indexing
      config:
        collection_name: rag_documents
        vector_size: 2048
        distance: Cosine
        recreate: false

    knowledge_store:
      strategy: qdrant_store
      config:
        collection_name: rag_documents
        validate: true

    retrieval:
      strategy: vector_rag
      config:
        top_k: 5
        top_k_rerank: 10
        query_rewrite: true
        use_hyde: true

    reranking:
      strategy: litellm_reranking
      config:
        model: rerank-english-v3.0
        top_k: 5

    response:
      strategy: contextual_response
      config:
        model: llama-3.3-70b-versatile
        temperature: 0.3
        max_tokens: 2048
        system_prompt: |
          You are a helpful RAG assistant. Answer based ONLY on the provided context.
          If the context doesn't contain enough information, say so clearly.
          Cite sources using [source: filename] notation.
