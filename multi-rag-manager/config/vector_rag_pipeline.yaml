# Vector RAG Pipeline - dense retrieval with HyDE query rewriting and reranking
pipeline:
  name: vector_rag_pipeline
  description: Dense retrieval with HyDE query expansion + cross-encoder reranking

  stages:
    ingestion:
      strategy: text_ingestion
      config:
        encoding: utf-8

    chunking:
      strategy: recursive_chunking
      config:
        chunk_size: 1000
        chunk_overlap: 200
        separators: ["\n\n", "\n", ". ", " ", ""]

    embedding:
      strategy: litellm_embedding
      config:
        model: nvidia-embed
        dimensions: 2048

    indexing:
      strategy: qdrant_indexing
      config:
        collection_name: rag_documents
        vector_size: 2048
        distance: Cosine
        recreate: false

    retrieval:
      strategy: vector_rag
      config:
        top_k: 5
        top_k_rerank: 10
        query_rewrite: true
        use_hyde: true
        hyde_model: llama-3.3-70b-versatile

    reranking:
      strategy: litellm_reranking
      config:
        model: rerank-english-v3.0
        top_k: 5

    response:
      strategy: contextual_response
      config:
        model: llama-3.3-70b-versatile
        temperature: 0.3
        max_tokens: 2048
        system_prompt: |
          You are a helpful RAG assistant. Answer the user's question based ONLY on the provided context.
          If the context doesn't contain enough information, say so clearly.
          Cite your sources using [source: filename] notation.
